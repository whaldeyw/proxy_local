services:
  tg-proxy:
    build: .
    container_name: tg-proxy
    restart: unless-stopped    # Перезапуск только если не остановлен вручную
    ports:
      - "8444:8444"
    environment:
      - PORT=8444
      - PYTHONUNBUFFERED=1
    volumes:
      - ./secret.txt:/app/secret.txt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8444/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
