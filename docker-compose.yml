services:
  tg-proxy:
    build: .
    container_name: ${CONTAINER_NAME:-tg-proxy}
    restart: unless-stopped
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - HOST=${HOST:-0.0.0.0}
      - SECRET=${SECRET}
      - EXTERNAL_IP=${EXTERNAL_IP:-}
      - PYTHONUNBUFFERED=1
      - TZ=${TIMEZONE:-Europe/Moscow}
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"